<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCH 101 Attendance Test</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    #result {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
    }
  </style>
</head>
<body>
  <h1>Attendance Test Page</h1>
  <button onclick="testScan()">Test Scan (361DD0)</button>
  <div id="result">Waiting...</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5s3mBVSUgZ3jWCpUiizRgLO6xa904dKQjiLJtc-WFpWo3jlep6_pRUcNMrLSXwePNwA/exec";

    async function testScan() {
      document.getElementById("result").textContent = "Scanning...";
      try {
        const response = await fetch(APPS_SCRIPT_URL + "?qr=361DD0");
        const data = await response.json();
        document.getElementById("result").textContent = JSON.stringify(data);
      } catch (err) {
        document.getElementById("result").textContent = "ERROR: " + err.message;
      }
    }
  </script>
</body>
</html>
