<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCH 101 Attendance</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    #reader {
      width: 100%;
      margin-top: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      min-height: 60px;
    }
    .status-recorded { color: green; }
    .status-already { color: orange; }
    .status-error { color: red; }
  </style>
</head>
<body>
  <h1>ARCH 101 Attendance</h1>
  <div id="reader"></div>
  <div id="result">Point camera at QR code</div>
  <button id="nextButton" onclick="scanNext()" style="display:none; margin-top: 20px; font-size: 18px; padding: 12px 24px;">
    Scan Next Student
  </button>

  <script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5s3mBVSUgZ3jWCpUiizRgLO6xa904dKQjiLJtc-WFpWo3jlep6_pRUcNMrLSXwePNwA/exec";

  let isProcessing = false;
  let html5QrCode;

  const resultDiv = document.getElementById("result");
  const nextButton = document.getElementById("nextButton");

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    html5QrCode.pause(true);

    resultDiv.className = "";
    resultDiv.textContent = "Checking...";

    const fetchStart = Date.now();

    fetch(APPS_SCRIPT_URL + "?qr=" + encodeURIComponent(decodedText))
      .then(res => res.text())
      .then(text => {
        const elapsed = ((Date.now() - fetchStart) / 1000).toFixed(1);
        
        if (text.trim().startsWith("<")) {
          throw new Error("Server busy (waited " + elapsed + "s) — try again");
        }
        
        const data = JSON.parse(text);
        displayResult(data, elapsed);
        nextButton.style.display = "inline-block";
      })
      .catch(err => {
        const elapsed = ((Date.now() - fetchStart) / 1000).toFixed(1);
        resultDiv.className = "status-error";
        resultDiv.textContent = "TRY AGAIN\n" + err.message + "\n(" + elapsed + "s)";
        nextButton.style.display = "inline-block";
      });
  }

  function displayResult(data, elapsed) {
    let mainText = "";
    if (data.status === "RECORDED") {
      resultDiv.className = "status-recorded";
      mainText = data.name + "\nRecorded";
    } else if (data.status === "ALREADY_RECORDED") {
      resultDiv.className = "status-already";
      mainText = data.name + "\nAlready Recorded";
    } else if (data.status === "NOT_FOUND") {
      resultDiv.className = "status-error";
      mainText = "STUDENT NOT FOUND";
    } else if (data.status === "NO_CLASS_TODAY") {
      resultDiv.className = "status-error";
      mainText = "NO CLASS TODAY\nAttendance was not recorded.";
    } else if (data.status === "OUTSIDE_TIME") {
      resultDiv.className = "status-error";
      mainText = "OUTSIDE ATTENDANCE TIME\nAttendance was not recorded.";
    } else {
      resultDiv.className = "status-error";
      mainText = "ERROR: " + JSON.stringify(data);
    }
    resultDiv.textContent = mainText + "\n(" + elapsed + "s)";
  }

  function scanNext() {
    resultDiv.className = "";
    resultDiv.textContent = "Point camera at QR code";
    nextButton.style.display = "none";
    isProcessing = false;
    html5QrCode.resume();
  }

  function onScanFailure(error) {
    // called continuously while no QR is detected — ignore
  }

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess,
    onScanFailure
  ).catch(err => {
    resultDiv.className = "status-error";
    resultDiv.textContent = "Camera error: " + err;
  });
</script>
</body>
</html>
