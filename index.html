<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCH 101 Attendance</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    #reader {
      width: 100%;
      margin-top: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      min-height: 60px;
    }
    .status-recorded { color: green; }
    .status-already { color: orange; }
    .status-error { color: red; }
  </style>
</head>
<body>
  <h1>ARCH 101 Attendance</h1>
  <div id="reader"></div>
  <div id="result">Point camera at QR code</div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5s3mBVSUgZ3jWCpUiizRgLO6xa904dKQjiLJtc-WFpWo3jlep6_pRUcNMrLSXwePNwA/exec";

    let isProcessing = false; // prevents duplicate rapid-fire scans
    let lastScannedId = null;
    let lastScanTime = 0;

    const resultDiv = document.getElementById("result");

    function onScanSuccess(decodedText) {
      const now = Date.now();

      // Ignore if we're mid-request, or if this is the same code scanned
      // again within 3 seconds (i.e. still being held in front of camera)
      if (isProcessing) return;
      if (decodedText === lastScannedId && now - lastScanTime < 3000) return;

      lastScannedId = decodedText;
      lastScanTime = now;
      isProcessing = true;

      resultDiv.className = "";
      resultDiv.textContent = "Checking...";

      fetch(APPS_SCRIPT_URL + "?qr=" + encodeURIComponent(decodedText))
        .then(res => res.json())
        .then(data => {
          displayResult(data);
        })
        .catch(err => {
          resultDiv.className = "status-error";
          resultDiv.textContent = "ERROR: " + err.message;
        })
        .finally(() => {
          isProcessing = false;
        });
    }

    function displayResult(data) {
      if (data.status === "RECORDED") {
        resultDiv.className = "status-recorded";
        resultDiv.textContent = data.name + "\nRecorded";
      } else if (data.status === "ALREADY_RECORDED") {
        resultDiv.className = "status-already";
        resultDiv.textContent = data.name + "\nAlready Recorded";
      } else if (data.status === "NOT_FOUND") {
        resultDiv.className = "status-error";
        resultDiv.textContent = "STUDENT NOT FOUND";
      } else if (data.status === "NO_CLASS_TODAY") {
        resultDiv.className = "status-error";
        resultDiv.textContent = "NO CLASS TODAY\nAttendance was not recorded.";
      } else if (data.status === "OUTSIDE_TIME") {
        resultDiv.className = "status-error";
        resultDiv.textContent = "OUTSIDE ATTENDANCE TIME\nAttendance was not recorded.";
      } else {
        resultDiv.className = "status-error";
        resultDiv.textContent = "ERROR: " + JSON.stringify(data);
      }
    }

    function onScanFailure(error) {
      // called continuously while no QR is detected — ignore
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, // rear camera
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess,
      onScanFailure
    ).catch(err => {
      resultDiv.className = "status-error";
      resultDiv.textContent = "Camera error: " + err;
    });
  </script>
</body>
</html>
